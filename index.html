<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感塔罗抽牌</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app" v-cloak>
    <noscript>
      <p class="status-box error">需要启用 JavaScript 才能抽牌。</p>
    </noscript>

    <template v-if="error">
      <div class="status-box error">
        <p>{{ error }}</p>
        <button @click="fetchCards">重试加载</button>
      </div>
    </template>

    <template v-else-if="ready">
      <header class="app-header">
        <h1>灵感塔罗抽牌</h1>
        <p class="subtitle">抽一张牌，记录当下的讯息与心情。</p>
      </header>

      <section class="card-display" v-if="current">
        <div class="card-meta">
          <div class="card-name">{{ current.name }}</div>
          <div class="card-element">对应元素：{{ current.element }}</div>
        </div>
        <p class="card-meaning">{{ current.meaningUp }}</p>
      </section>

      <section class="controls">
        <button @click="drawCard" :disabled="!cards.length">抽牌</button>
        <button class="ghost" @click="reset">重置</button>
        <span class="counter">牌库：{{ cards.length }} 张</span>
      </section>

      <section class="history">
        <h2>抽牌历史</h2>
        <ul v-if="history.length" class="history-list">
          <li v-for="(item, index) in history" :key="index">
            <span class="history-name">{{ item.name }}</span>
            <span class="history-time">{{ item.time }}</span>
          </li>
        </ul>
        <p v-else class="empty">还没有抽牌记录。</p>
      </section>
    </template>

    <template v-else>
      <p class="loading">正在读取牌组……</p>
    </template>
  </div>

  <script type="module">
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          cards: [],
          current: null,
          history: [],
          ready: false,
          error: null
        };
      },
      methods: {
        drawCard() {
          if (!this.ready || !this.cards.length) return;
          const index = Math.floor(Math.random() * this.cards.length);
          const card = this.cards.splice(index, 1)[0];
          this.current = card;
          this.history.unshift({
            name: card.name,
            time: new Date().toLocaleString()
          });
        },
        reset() {
          this.history = [];
          this.current = null;
          this.fetchCards();
        },
        async fetchCards() {
          try {
            this.ready = false;
            this.error = null;
            this.current = null;
            const response = await fetch('cards.json');
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            const data = await response.json();
            this.cards = [...data];
            this.ready = true;
          } catch (error) {
            console.error('读取牌组失败', error);
            this.error = '读取牌组失败，请检查网络或重试。';
          }
        }
      },
      mounted() {
        this.fetchCards();
      }
    }).mount('#app');
  </script>
</body>
</html>
